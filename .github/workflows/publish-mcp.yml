name: Publish to MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: mcp-registry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'girapphe/memostem-plugins'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate public plugin package
        run: npm run check

      - name: Match release tag to registry version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const manifest = JSON.parse(readFileSync("server.json", "utf8"));
            const expected = `v${manifest.version}`;
            if (process.env.RELEASE_TAG !== expected) {
              throw new Error(`Release tag ${process.env.RELEASE_TAG} must equal ${expected}`);
            }
          '

      - name: Install pinned MCP publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl --fail --location --silent --show-error \
            --output mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check
          tar xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish remote server metadata
        run: ./mcp-publisher publish server.json
