interface:
  display_name: MemoStem Knowledge
  short_description: Save selected knowledge and retrieve reviewed context.
  brand_color: "#21124D"
  default_prompt: >-
    Use $memostem-proactive-capture for this request. Route by the user's actual intent: retrieve or study approved knowledge, check a known draft batch, or capture specifically selected general knowledge. Use the matching reference guide and live tools, preserve consent and privacy, and report only confirmed results.
policy:
  allow_implicit_invocation: true
