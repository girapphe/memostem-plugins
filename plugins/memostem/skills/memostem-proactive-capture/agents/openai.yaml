  short_description: Save selected general knowledge as private memo or Q&A drafts.
  default_prompt: Use MemoStem MCP to save the general knowledge I selected as concise atomic memo and question-and-answer drafts. Verify the connection, complete OAuth if needed, and report the returned pending drafts and review link.
