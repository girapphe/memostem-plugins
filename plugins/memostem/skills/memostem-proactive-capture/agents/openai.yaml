interface:
  display_name: MemoStem Knowledge
  short_description: Save selected knowledge and retrieve reviewed context.
  brand_color: "#21124D"
  default_prompt: Use $memostem-proactive-capture for this request. Reply in the user's current language, or the host locale when the conversation language is unclear. Follow the existing capture flow for the current conversation; if it has no eligible material, use only recent conversation context the host provides, and say when none is available.
policy:
  allow_implicit_invocation: true
